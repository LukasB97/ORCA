[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "orca"
version = "0.1.0"
description = "Generate GraphicEQ room correction filters from REW measurements."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
]

[project.optional-dependencies]
plot = [
    "matplotlib>=3.5",
]

[project.scripts]
orca-eq = "orca.cli:main"

[tool.setuptools.packages.find]
include = ["orca*"]
